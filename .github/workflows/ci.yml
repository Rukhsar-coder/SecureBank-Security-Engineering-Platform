name: SecureBank CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-security-checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      #################################################
      # BACKEND SECURITY VALIDATION
      #################################################

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Security Tests
        working-directory: ./backend
        run: npm test

      - name: Backend Dependency Vulnerability Scan
        working-directory: ./backend
        run: npm audit --audit-level=high

      #################################################
      # FRONTEND SECURITY VALIDATION
      #################################################

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Frontend Dependency Vulnerability Scan
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Frontend Build Validation
        working-directory: ./frontend
        run: npm run build

      #################################################
      # PIPELINE STATUS
      #################################################

      - name: CI Pipeline Success
        run: echo "SecureBank security pipeline completed successfully."
